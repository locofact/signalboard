# 매일 장 마감 후 자동으로 데이터를 받아 페이지를 다시 만들고 GitHub Pages에 배포합니다.
# 시간은 UTC 기준입니다.
#   - 22:00 UTC (한국 07:00): 미국장 마감 후
#   - 07:30 UTC (한국 16:30): 국내장 마감 후

name: Daily update

on:
  schedule:
    - cron: "0 22 * * 1-5"
    - cron: "30 7 * * 1-5"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼
  push:
    branches: [main] # 코드를 올리면 바로 다시 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate site
        run: python generate.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
